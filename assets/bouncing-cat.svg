<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Cute animated cat bouncing across the page">
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-95 0; 1095 0" dur="8.5s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 18; 0 -5; 0 18" dur="0.72s" repeatCount="indefinite"/>

      <!-- soft shadow -->
      <ellipse cx="50" cy="94" rx="34" ry="7" fill="#000" opacity="0.10">
        <animate attributeName="rx" values="34;25;34" dur="0.72s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.10;0.05;0.10" dur="0.72s" repeatCount="indefinite"/>
      </ellipse>

      <!-- tail -->
      <path d="M21 57 C-8 48,-12 22,7 20 C19 19,23 29,16 36"
            fill="none" stroke="#8b949e" stroke-width="9" stroke-linecap="round">
        <animate attributeName="d"
          values="M21 57 C-8 48,-12 22,7 20 C19 19,23 29,16 36;
                  M21 57 C-4 64,-14 44,0 33 C10 25,21 28,18 38;
                  M21 57 C-8 48,-12 22,7 20 C19 19,23 29,16 36"
          dur="1.1s" repeatCount="indefinite"/>
      </path>

      <!-- body -->
      <ellipse cx="48" cy="60" rx="31" ry="26" fill="#d2a679" stroke="#57606a" stroke-width="2"/>

      <!-- back leg -->
      <ellipse cx="33" cy="80" rx="12" ry="8" fill="#d2a679" stroke="#57606a" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate"
          values="-10 33 80;12 33 80;-10 33 80" dur="0.72s" repeatCount="indefinite"/>
      </ellipse>

      <!-- front leg -->
      <ellipse cx="63" cy="80" rx="12" ry="8" fill="#d2a679" stroke="#57606a" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate"
          values="12 63 80;-10 63 80;12 63 80" dur="0.72s" repeatCount="indefinite"/>
      </ellipse>

      <!-- head -->
      <circle cx="69" cy="42" r="23" fill="#d2a679" stroke="#57606a" stroke-width="2"/>

      <!-- ears -->
      <path d="M53 27 L58 7 L67 23 Z" fill="#d2a679" stroke="#57606a" stroke-width="2"/>
      <path d="M76 22 L88 8 L89 31 Z" fill="#d2a679" stroke="#57606a" stroke-width="2"/>
      <path d="M58 22 L60 13 L64 22 Z" fill="#eeb4b4"/>
      <path d="M81 21 L87 14 L87 24 Z" fill="#eeb4b4"/>

      <!-- face -->
      <circle cx="62" cy="40" r="2.8" fill="#24292f"/>
      <circle cx="77" cy="40" r="2.8" fill="#24292f"/>
      <path d="M68 47 L72 47 L70 50 Z" fill="#d96c75"/>
      <path d="M70 50 Q66 54 63 51" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M70 50 Q74 54 77 51" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linecap="round"/>

      <!-- whiskers -->
      <path d="M57 49 L43 46 M57 53 L42 55 M82 49 L95 45 M82 53 L96 56"
            stroke="#57606a" stroke-width="1.3" stroke-linecap="round"/>

      <!-- tiny collar -->
      <path d="M54 60 Q69 67 82 57" fill="none" stroke="#58a6ff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="69" cy="64" r="3" fill="#f2cc60"/>
    </g>
  </g>
</svg>