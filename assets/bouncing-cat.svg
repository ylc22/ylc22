<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-label="Cute muted lavender pixel cat walking across the page">
  <g shape-rendering="crispEdges">
    <animateTransform attributeName="transform" type="translate"
      values="-100 0;1100 0" dur="9s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 16;0 2;0 16" dur="0.7s" repeatCount="indefinite"/>

      <!-- shadow -->
      <rect x="20" y="101" width="62" height="7" rx="2" fill="#1f2430" opacity=".12">
        <animate attributeName="width" values="62;48;62" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="x" values="20;27;20" dur="0.7s" repeatCount="indefinite"/>
      </rect>

      <!-- tail -->
      <path d="M25 63 H12 V52 H5 V35 H12 V27 H24 V35 H31 V50 H25 Z"
            fill="#625c7d" stroke="#3f3a55" stroke-width="3"/>
      <rect x="9" y="32" width="13" height="8" fill="#91c9bf"/>
      <rect x="15" y="48" width="12" height="8" fill="#91c9bf"/>

      <!-- body -->
      <rect x="26" y="49" width="52" height="37" rx="8" fill="#8f88aa" stroke="#3f3a55" stroke-width="3"/>
      <rect x="31" y="53" width="7" height="23" fill="#77708f"/>
      <rect x="43" y="52" width="7" height="21" fill="#77708f"/>
      <rect x="55" y="53" width="7" height="19" fill="#91c9bf"/>

      <!-- legs -->
      <g>
        <rect x="30" y="80" width="13" height="19" rx="3" fill="#8f88aa" stroke="#3f3a55" stroke-width="3">
          <animate attributeName="y" values="80;74;80" dur="0.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="61" y="80" width="13" height="19" rx="3" fill="#8f88aa" stroke="#3f3a55" stroke-width="3">
          <animate attributeName="y" values="74;80;74" dur="0.7s" repeatCount="indefinite"/>
        </rect>
        <rect x="32" y="92" width="10" height="6" fill="#f3d6cf"/>
        <rect x="63" y="92" width="10" height="6" fill="#f3d6cf"/>
      </g>

      <!-- head -->
      <rect x="55" y="24" width="43" height="44" rx="9" fill="#9a93b6" stroke="#3f3a55" stroke-width="3"/>

      <!-- ears -->
      <path d="M58 30 L61 13 L72 27 Z" fill="#9a93b6" stroke="#3f3a55" stroke-width="3"/>
      <path d="M83 27 L94 13 L96 33 Z" fill="#9a93b6" stroke="#3f3a55" stroke-width="3"/>
      <path d="M62 26 L64 19 L68 27 Z" fill="#e7a79c"/>
      <path d="M87 25 L93 19 L93 29 Z" fill="#e7a79c"/>

      <!-- muzzle -->
      <rect x="64" y="43" width="27" height="17" rx="7" fill="#eee9df"/>

      <!-- eyes -->
      <rect x="63" y="36" width="7" height="9" rx="2" fill="#2d2a3a"/>
      <rect x="84" y="36" width="7" height="9" rx="2" fill="#2d2a3a"/>
      <rect x="65" y="37" width="2" height="2" fill="#fff"/>
      <rect x="86" y="37" width="2" height="2" fill="#fff"/>

      <!-- nose/mouth -->
      <rect x="75" y="46" width="5" height="4" fill="#cf7f78"/>
      <path d="M77 50 V53 M77 53 H72 M77 53 H82"
            stroke="#3f3a55" stroke-width="2" fill="none"/>

      <!-- whiskers -->
      <path d="M64 49 H52 M64 54 H50 M91 49 H103 M91 54 H105"
            stroke="#5b556d" stroke-width="2"/>

      <!-- collar + star -->
      <rect x="59" y="62" width="31" height="5" fill="#91c9bf"/>
      <path d="M75 64 l3 5 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z"
            fill="#d9b75f" stroke="#6a5b32" stroke-width="1"/>

      <!-- subtle cheek pixels -->
      <rect x="60" y="51" width="3" height="3" fill="#e4aaa4"/>
      <rect x="92" y="51" width="3" height="3" fill="#e4aaa4"/>
    </g>
  </g>
</svg>