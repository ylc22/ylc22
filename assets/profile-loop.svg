<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#8b949e"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="180" rx="20" fill="url(#bg)"/>

  <text x="450" y="34" text-anchor="middle" fill="#f0f6fc"
        font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">
    Biology → Machine Learning → Product
  </text>

  <text x="450" y="55" text-anchor="middle" fill="#8b949e"
        font-family="Arial, Helvetica, sans-serif" font-size="12">
    scientific data • modeling • real-world deployment
  </text>

  <!-- subtle flowing backbone -->
  <path d="M110 112 C220 78, 310 145, 420 108 S640 78, 790 112"
        fill="none" stroke="url(#flow)" stroke-width="2.5" opacity="0.55"
        stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- input: sequence / biology -->
  <g transform="translate(155 112)">
    <rect x="-58" y="-29" width="116" height="58" rx="12"
          fill="#161b22" stroke="#30363d"/>
    <text x="0" y="-5" text-anchor="middle" fill="#58a6ff"
          font-family="monospace" font-size="14">A G T C</text>
    <text x="0" y="15" text-anchor="middle" fill="#8b949e"
          font-family="Arial, Helvetica, sans-serif" font-size="11">biological data</text>
    <circle r="3.5" cx="-38" cy="-16" fill="#58a6ff">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- middle: model / representation -->
  <g transform="translate(450 112)">
    <rect x="-72" y="-29" width="144" height="58" rx="12"
          fill="#161b22" stroke="#30363d"/>
    <g opacity="0.9">
      <circle cx="-35" cy="-8" r="4" fill="#8b949e"/>
      <circle cx="-10" cy="9" r="4" fill="#8b949e"/>
      <circle cx="15" cy="-9" r="4" fill="#8b949e"/>
      <circle cx="40" cy="8" r="4" fill="#8b949e"/>
      <line x1="-35" y1="-8" x2="-10" y2="9" stroke="#484f58" stroke-width="1.5"/>
      <line x1="-10" y1="9" x2="15" y2="-9" stroke="#484f58" stroke-width="1.5"/>
      <line x1="15" y1="-9" x2="40" y2="8" stroke="#484f58" stroke-width="1.5"/>
      <circle cx="15" cy="-9" r="5" fill="#3fb950" filter="url(#softGlow)">
        <animate attributeName="r" values="4.5;6;4.5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="0" y="22" text-anchor="middle" fill="#8b949e"
          font-family="Arial, Helvetica, sans-serif" font-size="11">ML / representation</text>
  </g>

  <!-- output: product / deployment -->
  <g transform="translate(745 112)">
    <rect x="-61" y="-29" width="122" height="58" rx="12"
          fill="#161b22" stroke="#30363d"/>
    <polyline points="-36,10 -18,-3 -4,3 12,-14 34,-4"
              fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="-14" r="3.5" fill="#3fb950">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="22" text-anchor="middle" fill="#8b949e"
          font-family="Arial, Helvetica, sans-serif" font-size="11">product / deployment</text>
  </g>

  <!-- moving data particles -->
  <circle r="4" fill="#58a6ff">
    <animateMotion dur="4.4s" repeatCount="indefinite"
      path="M110 112 C220 78, 310 145, 420 108 S640 78, 790 112"/>
  </circle>
  <circle r="3" fill="#3fb950" opacity="0.9">
    <animateMotion begin="2.2s" dur="4.4s" repeatCount="indefinite"
      path="M110 112 C220 78, 310 145, 420 108 S640 78, 790 112"/>
  </circle>
</svg>